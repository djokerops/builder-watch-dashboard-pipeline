name: Refresh Watchtower CSVs → Dune

on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC daily
  workflow_dispatch: {}        # allow manual runs from the Actions tab

concurrency:
  group: watchtower-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build CSVs and upload to Dune
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python -m pipeline.run

      - name: Upload CSVs as run artifacts (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchtower-csvs
          path: out/*.csv
          if-no-files-found: ignore
